[workspace.package]
edition = "2021"
rust-version = "1.70"
license = "GPL-3.0"
authors = ["Zainium Dynamics"]

# Every `unsafe` block must carry a real `// SAFETY:` justification —
# matches the discipline already enforced in zainix-kernel/relibc-zainium
# and the near-zero-unsafe bar oxideutils already meets. Each member crate
# opts in via `[lints]\nworkspace = true` in its own Cargo.toml.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
not_unsafe_ptr_arg_deref = "deny"

# Shared dependency versions, matching zex-native/elevate's convention —
# crates opt in with `dep = { workspace = true }` instead of repinning a
# version locally. Not every cmd/* crate has been migrated to reference
# these yet (that's a larger, separate pass); this table exists so newly
# touched crates converge on one version instead of drifting.
[workspace.dependencies]
usercore = { path = "core" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
colored = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
regex = "1"
rayon = "1.8"
walkdir = "2"
indicatif = { version = "0.17", features = ["rayon"] }
crossbeam-channel = "0.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
filetime = "0.2"
xattr = "1"
bytesize = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Optimized for a fleet of small discrete binaries: size and cold-start
# latency matter as much as throughput here, matching the same tradeoff
# zex-native/elevate makes. `panic = "abort"` only affects this profile —
# `cargo test`/`cargo build` (dev/test profiles) are unaffected and keep
# unwinding, so the test harness still isolates per-test panics normally.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"
panic = "abort"

# Opt-in profile for throughput-sensitive builds (bulk copy/move/hash paths
# in cp, mv, drive, the checksum utils) where raw speed matters more than
# binary size: `cargo build --profile release-fast`.
[profile.release-fast]
inherits = "release"
opt-level = 3
