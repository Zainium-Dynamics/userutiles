# =============================================================================
# user_utils — GitLab CI/CD
# =============================================================================
# Fix for empty/instant-failed pipelines:
#   Settings -> CI/CD -> Runners -> enable "Turn on instance runners for this project"
# =============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - test
  - build

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-ci"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  FF_TIMESTAMPS: "true"

default:
  image: rust:latest
  interruptible: true

.cargo_job:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: user_utils-cargo
    paths:
      - .cargo-ci/registry/
      - .cargo-ci/git/
      - target/
    policy: pull-push
  before_script:
    - rustc --version && cargo --version

# =============================================================================
# check
# =============================================================================

check:
  extends: .cargo_job
  stage: check
  script:
    - cargo check --workspace

clippy:
  extends: .cargo_job
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

fmt:
  extends: .cargo_job
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
  allow_failure: true

# =============================================================================
# test
# =============================================================================

test:
  extends: .cargo_job
  stage: test
  timeout: 45m
  script:
    - cargo test --workspace

# =============================================================================
# build
# =============================================================================

# Host glibc build -- every discrete cmd/* binary.
build:host:
  extends: .cargo_job
  stage: build
  script:
    - ./scripts/build.sh
    - test -x target/release/cat
    - test -x target/release/ls
  artifacts:
    name: "user_utils-host-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/release/
    expire_in: 1 week
