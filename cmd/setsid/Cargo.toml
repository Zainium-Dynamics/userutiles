[package]
name = "user_setsid"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX setsid — run a program in a new session"
license = "GPL-3.0"
publish = false

[lib]
name = "user_setsid"
path = "src/lib.rs"

[[bin]]
name = "setsid"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
libc = "0.2"

[lints]
workspace = true
