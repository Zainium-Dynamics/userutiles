[package]
name = "user_mv"
version = "1.0.0"
edition = "2021"
authors = ["Zainium Dynamics"]
description = "mv — next-generation move for Zainium OS (formerly xmv)"
license = "GPL-3.0"
publish = false

[lib]
name = "xmv"
path = "src/lib.rs"

[[bin]]
name = "mv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "cargo"] }
rayon = "1.8"
walkdir = "2"
indicatif = { version = "0.17", features = ["rayon"] }
libc = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
filetime = "0.2"
xattr = "1"
thiserror = "1"
anyhow = "1"
crossbeam-channel = "0.5"
colored = "2"
bytesize = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ctrlc = "3"

[lints]
workspace = true
