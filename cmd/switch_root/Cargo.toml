[package]
name = "user_switch_root"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX switch_root — switch to another filesystem as root (initramfs)"
license = "GPL-3.0"
publish = false

[lib]
name = "user_switch_root"
