[package]
name = "user_uuidgen"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX uuidgen — create RFC 4122 universally unique identifiers"
license = "GPL-3.0"
publish = false

[lib]
name = "user_uuidgen"
path = "src/lib.rs"

[[bin]]
name = "uuidgen"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
libc = "0.2"

[lints]
workspace = true
