[package]
name = "user_trace"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "trace — process & syscall inspector for Zainium OS"
license = "GPL-3.0"
publish = false

[lib]
name = "user_trace"
path = "src/lib.rs"

[[bin]]
name = "trace"
path = "src/main.rs"

[dependencies]
user-seccomp = { path = "../user-seccomp" }
libc = "0.2"
nix = { version = "0.26", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
chrono = "0.4"
regex = "1.10"
procfs = "0.14"
colored = "2.0"

[dev-dependencies]
tempfile = "3.8"

[lints]
workspace = true
