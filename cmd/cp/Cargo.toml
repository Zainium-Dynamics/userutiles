[package]
name = "user_cp"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX cp — copy files and directories, reflink/sparse-aware, atomic overwrite"
license = "GPL-3.0"
publish = false

[lib]
name = "user_cp"
path = "src/lib.rs"

[[bin]]
name = "cp"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
clap = { version = "4", features = ["derive", "cargo"] }
rayon = "1.8"
walkdir = "2"
indicatif = { version = "0.17", features = ["rayon"] }
libc = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
filetime = "0.2"
xattr = "1"
thiserror = "1"
crossbeam-channel = "0.5"
colored = "2"
bytesize = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
