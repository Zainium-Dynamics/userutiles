[package]
name = "user_hexdump"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX hexdump — display file contents in hexadecimal, decimal, octal, or ascii"
license = "GPL-3.0"
publish = false

[lib]
name = "user_hexdump"
path = "src/lib.rs"

[[bin]]
name = "hexdump"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }

[lints]
workspace = true
