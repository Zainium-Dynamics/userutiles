[package]
name = "trigger"
version = "1.0.0"
edition = "2021"
description = "Trigger — Universal application and script runner for Zainium OS"

[lib]
name = "trigger"
path = "src/lib.rs"

[[bin]]
name = "trigger"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
nix = { version = "0.27", features = ["user"] }
strsim = "0.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
once_cell = "1.19"
owo-colors = { version = "4", features = ["supports-colors"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bench]]
name = "discovery_bench"
harness = false

[lints]
workspace = true
