[package]
name = "drive"
version = "1.0.0"
edition = "2021"
authors = ["Zainium Dynamics"]
description = "ZainiumOS Advanced Storage Manager"
license = "MIT"

[[bin]]
name = "drive"
path = "src/main.rs"

# Build man page: cargo run --bin generate-manpage --features manpage
[[bin]]
name = "generate-manpage"
path = "src/bin/generate_manpage.rs"
required-features = ["manpage"]

[features]
manpage = ["clap_mangen"]

[dependencies]
usercore = { path = "../../core" }
clap = { version = "4", features = ["derive", "color"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
libc = "0.2"
which = "6"
dirs-next = "2"
toml = "0.8"

[dependencies.clap_mangen]
version = "0.2"
optional = true

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
toml = "0.8"

[lints]
workspace = true
