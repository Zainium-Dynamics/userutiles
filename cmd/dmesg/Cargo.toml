[package]
name = "user_dmesg"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX dmesg — display or control the kernel ring buffer"
license = "GPL-3.0"
publish = false

[lib]
name = "user_dmesg"
path = "src/lib.rs"

[[bin]]
name = "dmesg"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
chrono = "0.4"
libc = "0.2"

[lints]
workspace = true
