[package]
name = "user_diffutils"
version = "0.5.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX diff/cmp — vendored from uutils/diffutils 0.5.0 (MIT/Apache-2.0), no uucore"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "user_diffutils"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
diff = "0.1"
itoa = "1"
regex = "1"
same-file = "1"
unicode-width = "0.2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[lints]
workspace = true
