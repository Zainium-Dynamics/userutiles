[package]
name = "user_fsfreeze"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX fsfreeze — suspend or resume modifications to a mounted filesystem"
license = "GPL-3.0"
publish = false

[lib]
name = "user_fsfreeze"
path = "src/lib.rs"

[[bin]]
name = "fsfreeze"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
libc = "0.2"

[lints]
workspace = true
