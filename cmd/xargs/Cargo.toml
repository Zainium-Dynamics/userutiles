[package]
name = "user_xargs"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX xargs — build and execute command lines from standard input"
license = "GPL-3.0"
publish = false

[lib]
name = "user_xargs"
path = "src/lib.rs"

[[bin]]
name = "xargs"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
libc = "0.2"

[lints]
workspace = true
