[package]
name = "user_find"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX find — search for files in a directory hierarchy"
license = "GPL-3.0"
publish = false

[lib]
name = "user_find"
path = "src/lib.rs"

[[bin]]
name = "find"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
libc = "0.2"
colored = "2"


[lints]
workspace = true
