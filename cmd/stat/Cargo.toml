[package]
name = "user_stat"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX stat — display file or filesystem status"
license = "GPL-3.0"
publish = false

[lib]
name = "user_stat"
path = "src/lib.rs"

[[bin]]
name = "stat"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
libc = "0.2"
colored = "2"


[lints]
workspace = true
