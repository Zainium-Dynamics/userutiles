[package]
name = "user_shred"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX shred — overwrite a file to hide its contents"
license = "GPL-3.0"
publish = false

[lib]
name = "user_shred"
path = "src/lib.rs"

[[bin]]
name = "shred"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
libc = "0.2"


[lints]
workspace = true
