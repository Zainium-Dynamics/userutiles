[package]
name = "user_link"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX link — call the link function to create a link to a file"
license = "GPL-3.0"
publish = false

[lib]
name = "user_link"
path = "src/lib.rs"

[[bin]]
name = "link"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
libc = "0.2"


[lints]
workspace = true
