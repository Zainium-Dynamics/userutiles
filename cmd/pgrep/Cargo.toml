[package]
name = "user_pgrep"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX pgrep — look up processes based on name"
license = "GPL-3.0"
publish = false

[lib]
name = "user_pgrep"
path = "src/lib.rs"

[[bin]]
name = "pgrep"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
libc = "0.2"


[lints]
workspace = true
