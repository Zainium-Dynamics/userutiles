[package]
name = "user_basenc"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX basenc — Encode/decode data and print to standard output"
license = "GPL-3.0"
publish = false

[lib]
name = "user_basenc"
path = "src/lib.rs"

[[bin]]
name = "basenc"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
libc = "0.2"

[lints]
workspace = true
