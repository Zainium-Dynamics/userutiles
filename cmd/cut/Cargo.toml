[package]
name = "user_cut"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Zainium Dynamics"]
description = "ZEX cut — remove sections from each line of files"
license = "GPL-3.0"
publish = false

[lib]
name = "user_cut"
path = "src/lib.rs"

[[bin]]
name = "cut"
path = "src/main.rs"

[dependencies]
usercore = { path = "../../core" }
libc = "0.2"


[lints]
workspace = true
